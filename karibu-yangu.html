<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumanneTok TZ - Karibu Yangu</title>
    
    <!-- Link ya FontAwesome kwa ajili ya ikoni zote za mfumo -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.min.css">

</head>
<body>

    <!-- 1. SEHEMU YA JUU (SEARCH ENGINE MAALUM - REDIRECT TO SEARCH.HTML) -->
    <header class="explore-header">
        <div class="explore-search-container">
            <i class="fas fa-search search-inside-icon"></i>
            <!-- Mtumiaji akibonyeza tu hapa, mfumo unamvuta na kumpeleka search.html kiotomatiki -->
            <input type="text" id="local-search-input" placeholder="Tafuta mtaa, wilaya au mkoa wa karibu..." onclick="window.location.href='search.html'">
        </div>
    </header>

    <!-- 2. SEHEMU YA KATEGORIA ZA KIJIOGRAFIA (LOCATION TABS) -->
    <div class="category-scroll-wrapper">
        <div class="category-tabs">
            <span class="cat-tab active" data-location="street">Mtaa Wangu</span>
            <span class="cat-tab" data-location="district">Wilaya Yangu</span>
            <span class="cat-tab" data-location="region">Mkoa Wangu</span>
        </div>
    </div>

    <!-- 3. SEHEMU KUU AMBAPO JAVASCRIPT ITAMWAGA VIDEO (GRID VIEW) -->
    <main class="explore-grid-container" id="local-dynamic-grid">
        <!-- JAVASCRIPT ITAMWAGA KADI ZA VIDEO ZA MAENEO HAPA KIOTOMATIKI -->
    </main>

    <!-- 4. SEHEMU YA CHINI (BOTTOM NAVIGATION BAR) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>

        <!-- Explore inabaki active kwa sababu hii ni sehemu ya ugunduzi -->
        <a href="explore.html" class="nav-item active">
            <i class="fas fa-compass"></i>
            <span>Explore</span>
        </a>

        <a href="upload.html" class="nav-item tz-upload-btn">
            <div class="tz-layer green-layer"></div>
            <div class="tz-layer blue-layer"></div>
            <div class="upload-icon-center">
                <i class="fas fa-plus"></i>
            </div>
        </a>

        <a href="weekchallenge.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>WeekChallenge</span>
        </a>

        <a href="profile.html" class="nav-item" id="profile-nav-link">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Kuunganisha JavaScript maalum kwa ajili ya kupakia video za kijiografia -->
    <script src="local-talent.js"></script>
</body>
</html>
