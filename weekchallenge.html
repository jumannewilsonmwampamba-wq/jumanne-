<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumanneTok TZ - Wiki Changamoto</title>
    
    <!-- Link ya FontAwesome kwa ajili ya ikoni zote za mfumo -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.min.css">

</head>
<body>

    <!-- 1. SEHEMU YA JUU (SEARCH ENGINE MAALUM YA CHANGAMOTO) -->
    <header class="explore-header">
        <div class="explore-search-container">
            <i class="fas fa-search search-inside-icon"></i>
            <!-- Mtumiaji akibonyeza hapa anapelekwa kwenye mfumo wa search-explore.html -->
            <input type="text" id="challenge-search-trigger" placeholder="Tafuta changamoto za wiki..." onclick="window.location.href='search-weekchallenge.html'">
        </div>
    </header>

    <!-- 2. KATEGORIA KUU ZILIZO CHINI YA SEARCH (ZOTE IKAE MWANZO) -->
    <div class="category-scroll-wrapper" style="top: 60px;">
        <div class="category-tabs">
            <!-- Kategoria ya 'Zote' sasa ndio inaanza mwanzo kabisa na iko active -->
            <span class="cat-tab active" data-tab="all">Zote</span>
            
          <a href="trendmap-challenge.html" class="cat-tab-link">
    <span class="cat-tab">Trend Map</span>
</a>

            
            <!-- MTUMIAJI AKIBONYEZA HAPA MFUMO UNAMPELEKA KWENYE FILE MPYA LA MIKOA -->
            <a href="mkoa.html" class="cat-tab-link">
                <span class="cat-tab">Mkoa</span>
            </a>
            
            <a href="wilaya-bara.html">
                <span class="cat-tab" data-tab="district">Wilaya</span>
            </a>
          <a href="mtaa-challenge.html" class="cat-tab-link"><span class="cat-tab">Mtaa</span></a>
        </div>
    </div>

    <!-- 3. SEHEMU KUU AMBAPO JAVASCRIPT ITAMWAGA DATA YA CHANGAMOTO (GRID VIEW) -->
    <main class="challenge-main-container" style="margin-top: 115px;">
        <!-- Gridi tupu ambapo JavaScript itamwaga maudhui kulingana na tab iliyochaguliwa -->
        <div class="explore-grid-container" id="challenge-content-area">
            <!-- JAVASCRIPT ITAMWAGA MATOKEO YA LIVE VIDEO AU TAKWIMU HAPA KIOTOMATIKI -->
        </div>
    </main>

    <!-- 4. SEHEMU YA CHINI (BOTTOM NAVIGATION BAR) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>

        <a href="explore.html" class="nav-item">
            <i class="fas fa-compass"></i>
            <span>Explore</span>
        </a>

        <a href="upload.html" class="nav-item tz-upload-btn">
            <div class="tz-layer green-layer"></div>
            <div class="tz-layer blue-layer"></div>
            <div class="upload-icon-center">
                <i class="fas fa-plus"></i>
            </div>
        </a>

        <!-- Kitufe cha Week Challenge kiko hai (Active) hapa -->
        <a href="weekchallenge.html" class="nav-item active">
            <i class="fas fa-trophy"></i>
            <span>WeekChallenge</span>
        </a>

        <a href="profile.html" class="nav-item" id="profile-nav-link">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Kuunganisha JavaScript kwa ajili ya usimamizi wa tabu na maudhui ya changamoto -->
    <script src="week-challenge.js"></script>
</body>
</html>
