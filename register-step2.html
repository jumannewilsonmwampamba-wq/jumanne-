<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumanneTok TZ - Usajili Hatua ya 2</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Faili la ikoni za FontAwesome -->
    <link rel="stylesheet" href="css/all.min.css">
</head>
<body>

    <!-- CONTAINER KUU YA USAJILI -->
    <div class="jumanne-auth-container">
        
        <!-- BAR YA MAENDELEO (PROGRESS BAR) -->
        <div class="jumanne-progress-bar">
            <div class="jumanne-progress-fill" style="width: 28.5%;"></div>
        </div>
        <p class="jumanne-step-text">Hatua: <strong>2</strong> kati ya 7</p>

        <!-- FOMU YA USAJILI -->
        <form id="jumanne-step2-form">
            
            <!-- SEHEMU YA 2: ENEO UNALOTOKEA -->
            <div class="jumanne-form-step" id="jumanne-step-2">
                <!-- BOKSI LA SAA YA USALAMA (VISUAL COUNTDOWN TIMER) -->
                <div class="jumanne-timer-box">
                    <i class="fas fa-clock-rotate-left"></i>
                    Muda wa Usalama: <span id="jumanne-countdown-clock">03:00</span>
                </div>
                <h2 class="jumanne-step-title">Unapatikana Wapi?</h2>
                <p class="jumanne-step-subtitle">Andika eneo lako ili ushindani mkoa kwa mkoa uanze.</p>

                <!-- MTEGO WA SIRI WA MA-ROBOT (HONEYPOT) - Kila sehemu lazima iwe nao! -->
                <div class="jumanne-pot-field" style="display: none !important; visibility: hidden !important;">
                    <input type="text" id="jumanne-honey-location" name="honey_location" tabindex="-1" autocomplete="off">
                </div>

                <!-- Boksi la kuandika Mkoa -->
              <!---  <div class="jumanne-input-group">
                    <label for="jumanne-mkoa">Mkoa Wako</label>
                    <input type="text" id="jumanne-mkoa" placeholder="Mfano: Dar es Salaam, Mwanza" required autocomplete="address-level1">
                </div>
                           

                <!-- Boksi la kuandika Wilaya -->
                <div class="jumanne-input-group">
                    <label for="jumanne-wilaya">Wilaya Yako</label>
                    <input type="text" id="jumanne-wilaya" placeholder="Mfano: Ilala, Nyamagana" required autocomplete="address-level2">
                </div>
     <!-- Boksi la kuandika Mtaa -->
     <div class="jumanne-input-group">
         <label for="jumanne-mtaa">Mtaa Wako</label>
         <input type="text" id="jumanne-mtaa" placeholder="Mfano: Kariakoo, Komakoma" required>

                    <!-- BOKSI LA KUDUMU LA KUONYESHA MATOKEO VYA KATA ZA ARRAY -->
                    <div id="jumanne-search-results" style="background:#111; border:1px solid #222; border-radius:6px; margin-top:5px; max-height:180px; overflow-y:auto; padding:5px; display:none;"></div>
                </div>

                <!-- Vifungo vya Kusogea (Navigation Buttons) -->
                <div class="jumanne-btn-group">
                    <button type="button" class="jumanne-btn-back" id="jumanne-back-to-step1">Rudi Nyuma</button>
                    <button type="button" class="jumanne-btn-next" id="jumanne-btn-to-step3">Inayofuata</button>
                </div>

                <!-- BOKSI LA GOOGLE ADS LA HATUA YA 2 -->
                <div class="jumanne-ad-container">
                    <span class="jumanne-ad-label">TANGAZO</span>
                    <div class="jumanne-ad-box">
                        <p style="color: #666; font-size: 12px; margin: 0;">Google Ad Banner Here</p>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <!-- KUUNGANISHA JAVASCRIPT YA UKURASA HUU PEKEE -->
    <script src="register-step2.js"></script>
</body>
</html>
