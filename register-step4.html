<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumanneTok TZ - Usajili Hatua ya 4</title>
    <link rel="stylesheet" href="style.css">
    <!-- Faili la ikoni za FontAwesome -->
    <link rel="stylesheet" href="css/all.min.css">
</head>
<body>

    <!-- CONTAINER KUU YA USAJILI -->
    <div class="jumanne-auth-container">
        
        <!-- BAR YA MAENDELEO (PROGRESS BAR) -->
        <div class="jumanne-progress-bar">
            <div class="jumanne-progress-fill" style="width: 57.1%;"></div>
        </div>
        <p class="jumanne-step-text">Hatua: <strong>4</strong> kati ya 7</p>

        <!-- FOMU YA USAJILI -->
        <form id="jumanne-step4-form">
            
            <!-- SEHEMU YA 4: UTAMBULISHO WA ACCOUNTI -->
            <div class="jumanne-form-step" id="jumanne-step-4">
                <!-- BOKSI LA SAA YA USALAMA (VISUAL COUNTDOWN TIMER) -->
                <div class="jumanne-timer-box">
                    <i class="fas fa-clock-rotate-left"></i>
                    Muda wa Usalama: <span id="jumanne-countdown-clock">03:00</span>
                </div>
                
                <h2 class="jumanne-step-title">Namba ya Simu</h2>
                <p class="jumanne-step-subtitle">Itatumika kukutambua na kurejesha akaunti yako ukisahau password.</p>

                <!-- MTEGO WA SIRI WA MA-ROBOT (HONEYPOT) -->
                <div class="jumanne-pot-field" style="display: none !important; visibility: hidden !important;">
                    <input type="text" id="jumanne-honey-contact" name="honey_contact" tabindex="-1" autocomplete="off">
                </div>

                <!-- Boksi la kuandika Namba ya Simu -->
                <div class="jumanne-input-group">
                    <label for="jumanne-phone">Namba yako ya Simu (Ya Lazima)</label>
                    <input type="tel" id="jumanne-phone" placeholder="Mfano: 07XXXXXXXX" required autocomplete="tel">
                </div>

                <!-- Boksi la kuandika Email Mbadala -->
                <div class="jumanne-input-group">
                    <label for="jumanne-email">Barua Pepe / Email (Mbadala wa Hiyari)</label>
                    <input type="email" id="jumanne-email" placeholder="Mfano: juma@gmail.com" autocomplete="email">
                </div>

                <!-- Vifungo vya Kusogea (Navigation Buttons) -->
                <div class="jumanne-btn-group">
                    <button type="button" class="jumanne-btn-back" id="jumanne-back-to-step3">Rudi Nyuma</button>
                    <button type="button" class="jumanne-btn-next" id="jumanne-btn-to-step5">Inayofuata</button>
                </div>

                <!-- BOKSI LA GOOGLE ADS LA HATUA YA 4 -->
                <div class="jumanne-ad-container">
                    <span class="jumanne-ad-label">TANGAZO</span>
                    <div class="jumanne-ad-box">
                        <p style="color: #666; font-size: 12px; margin: 0;">Google Ad Banner Here</p>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <!-- KUUNGANISHA JAVASCRIPT YA UKURASA HUU PEKEE -->
    <script src="saruni.js"></script>
</body>
</html>
