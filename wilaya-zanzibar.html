<script>
    // INJINI YA KUTAFUTA WILAYA ZA ZANZIBAR LIVE (ZANZIBAR DISTRICT SEARCH CONTROLLER)
document.addEventListener("DOMContentLoaded", () => {
    
    const boksiLaZanzibarSearch = document.getElementById("zanzibar-search-trigger");

    // Sikiliza kila herufi inayoshuka kutoka kwenye keyboard ya simu
    boksiLaZanzibarSearch.addEventListener("input", function() {
        // Geuza maandishi kuwa herufi ndogo (Lower Case) kusafisha utafutaji
        const nenoLinalotafutwa = this.value.toLowerCase().trim();
        
        // Kamata vifungo vyote vya mikoa na wilaya (class="mkoa-card-btn")
        const vifungoVyaMaeneo = document.querySelectorAll(".mkoa-card-btn");

        vifungoVyaMaeneo.forEach(kifungo => {
            // Soma jina la eneo lililoandikwa juu ya kitufe
            const jinaLaEneo = kifungo.innerText.toLowerCase();

            // KAGUA: Kama jina lina herufi zinazofanana na zilizoandikwa kwenye search bar
            if (jinaLaEneo.includes(nenoLinalotafutwa)) {
                // Lifanye boksi libaki kiooni
                kifungo.style.setProperty("display", "inline-block", "important");
            } else {
                // Lifiche boksi kabisa lisivuruge kioo cha mtumiaji
                kifungo.style.setProperty("display", "none", "important");
            }
        });
    });
});

</script>
