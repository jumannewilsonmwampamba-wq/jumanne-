<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumanneTok TZ - Usajili Ulinzi</title>
    <link rel="stylesheet" href="style.css">
    <!-- Faili la ikoni za FontAwesome -->
    <link rel="stylesheet" href="css/all.min.css">
</head>
<body>

    <!-- CONTAINER KUU YA USAJILI -->
    <div class="jumanne-auth-container">
        
        <!-- BAR YA MAENDELEO (PROGRESS BAR) -->
        <div class="jumanne-progress-bar">
            <div class="jumanne-progress-fill" style="width: 71.4%;"></div>
        </div>
        <p class="jumanne-step-text">Hatua: <strong>5</strong> kati ya 7</p>

        <!-- FOMU YA USAJILI -->
        <form id="jumanne-step5-form">
            
            <!-- SEHEMU YA 5: ULINZI NA SELECTION YA PASSWORD -->
            <div class="jumanne-form-step" id="jumanne-step-5">
                <!-- BOKSI LA SAA YA USALAMA (VISUAL COUNTDOWN TIMER) -->
                <div class="jumanne-timer-box">
                    <i class="fas fa-clock-rotate-left"></i>
                    Muda wa Usalama: <span id="jumanne-countdown-clock">03:00</span>
                </div>
                
                <h2 class="jumanne-step-title">Weka Ulinzi wa Akaunti</h2>
                <p class="jumanne-step-subtitle">Tengeneza password salama ili kulinda kipaji na akaunti yako.</p>

                <!-- MTEGO WA SIRI WA MA-ROBOT (HONEYPOT) -->
                <div class="jumanne-pot-field" style="display: none !important; visibility: hidden !important;">
                    <input type="text" id="jumanne-honey-security" name="honey_security" tabindex="-1" autocomplete="off">
                </div>

                <!-- Boksi la kuandika Password Kuu -->
                <div class="jumanne-input-group">
                    <label for="jumanne-password-main">Password Kuu (Ya kuingilia kila siku)</label>
                    <input type="password" id="jumanne-password-main" placeholder="Weka password yako" required pattern="[0-9]{4,}" inputmode="numeric">
                </div>

                <!-- Boksi la kuandika Password ya Ziada / PIN -->
                <div class="jumanne-input-group">
                    <label for="jumanne-password-backup">Password ya Ziada / PIN ya Uokoaji (Namba 4)</label>
                    <input type="password" id="jumanne-password-backup" placeholder="Mfano: 1234" required pattern="[0-9]{4,}" inputmode="numeric">
                </div>

                <!-- Sehemu ya Kuchagua Swali la Siri -->
                <div class="jumanne-input-group">
                    <label for="jumanne-secret-question">Chagua Swali la Siri la Uokoaji</label>
                    <select id="jumanne-secret-question" required>
                        <option value="">-- Chagua Swali... --</option>
                        <option value="mwalimu">Jina la mwalimu wako wa kwanza wa shule ya msingi alikuwa nani?</option>
                        <option value="mtaa">Ulikulia mtaa gani au kijiji gani ulipokuwa mtoto?</option>
                        <option value="chakula">Chakula gani unachokipenda kuliko vyote?</option>
                        <option value="mnyama">Nini lilikuwa jina la mnyama wako wa kwanza wa nyumbani?</option>
                    </select>
                </div>

                <!-- Boksi la Jibu la Siri -->
                <div class="jumanne-input-group">
                    <label for="jumanne-secret-answer">Jibu la Swali la Siri</label>
                    <input type="text" id="jumanne-secret-answer" placeholder="Andika jibu lako hapa" required autocomplete="off">
                </div>

                <!-- Vifungo vya Kusogea (Navigation Buttons) -->
                <div class="jumanne-btn-group">
                    <button type="button" class="jumanne-btn-back" id="jumanne-back-to-step4">Rudi Nyuma</button>
                    <button type="button" class="jumanne-btn-next" id="jumanne-btn-to-step6">Inayofuata</button>
                </div>

                <!-- BOKSI LA GOOGLE ADS LA HATUA YA 5 -->
                <div class="jumanne-ad-container">
                    <span class="jumanne-ad-label">TANGAZO</span>
                    <div class="jumanne-ad-box">
                        <p style="color: #666; font-size: 12px; margin: 0;">Google Ad Banner Here</p>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <!-- KUUNGANISHA JAVASCRIPT YA UKURASA HUU PEKEE -->
    <script src="register-step6.js"></script>
</body>
</html>
