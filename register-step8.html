<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumanneTok TZ - Usajili Picha ya Wasifu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>
<body>

    <!-- CONTAINER KUU YA USAJILI -->
    <div class="jumanne-auth-container">
        
        <!-- BAR YA MAENDELEO -->
        <div class="jumanne-progress-bar">
            <div class="jumanne-progress-fill" style="width: 85.7%;"></div>
        </div>
        <p class="jumanne-step-text">Hatua: <strong>6</strong> kati ya 7</p>

        <!-- FOMU YA USAJILI -->
        <form id="jumanne-step6-form">
            
            <div class="jumanne-form-step" id="jumanne-step-6">
                <!-- BOKSI LA SAA YA USALAMA -->
                <div class="jumanne-timer-box">
                    <i class="fas fa-clock-rotate-left"></i>
                    Muda wa Usalama: <span id="jumanne-countdown-clock">03:00</span>
                </div>
                
                <h2 class="jumanne-step-title">Weka Picha Yako</h2>
                <p class="jumanne-step-subtitle">Pakia picha nzuri itakayowaonyesha mashabiki na majaji muonekano wako.</p>

                <!-- MTEGO WA SIRI WA MA-ROBOT -->
                <div class="jumanne-pot-field" style="display: none !important; visibility: hidden !important;">
                    <input type="text" id="jumanne-honey-avatar" name="honey_avatar" tabindex="-1" autocomplete="off">
                </div>

                <!-- 🔥 MDUARA MAALUM WA KIKOMANDOO WA KUONYESHA PICHA (CIRCULAR PREVIEW) -->
                <div style="display: flex; justify-content: center; align-items: center; margin: 20px 0;">
                    <div id="jumanne-avatar-preview" style="width: 130px; height: 130px; border-radius: 50%; border: 3px dashed #00f2fe; background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;">
                        <!-- Ikoni ya kamera ya msingi kabla ya kuchagua picha -->
                        <span id="jumanne-preview-placeholder" style="font-size: 40px; color: #555;">📷</span>
                    </div>
                </div>

                <!-- Sehemu ya Kupakia Picha -->
                <div class="jumanne-input-group jumanne-upload-group" style="text-align: center;">
                    <label for="jumanne-avatar" class="jumanne-avatar-label" style="display: inline-block; padding: 12px 25px; background: #222; border: 1px solid #333; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; color: #00f2fe;">
                        Chagua Picha ya Wasifu
                    </label>
                    <input type="file" id="jumanne-avatar" accept="image/*" style="display: none;">
                </div>

                <!-- Vifungo vya Kusogea -->
                <div class="jumanne-btn-group">
                    <button type="button" class="jumanne-btn-back" id="jumanne-back-to-step5">Rudi Nyuma</button>
                    <button type="button" class="jumanne-btn-next" id="jumanne-btn-to-step7">Inayofuata</button>
                </div>

                <!-- BOKSI LA GOOGLE ADS -->
                <div class="jumanne-ad-container">
                    <span class="jumanne-ad-label">TANGAZO</span>
                    <div class="jumanne-ad-box">
                        <p style="color: #666; font-size: 12px; margin: 0;">Google Ad Banner Here</p>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <script src="register-step7.js"></script>
</body>
</html>
