    <script>
// ==========================================================================
// INJINI MPYA YA UTANGAZAJI NA UTAFUTAJI WA MKOA (LIVE SEARCH CONTROLLER)
// ==========================================================================

function tafutaMkoa() {
    // 1. Kamata lile boksi la search kupitia ID yake
    const boksiLaSearch = document.getElementById("mkoa-search-input");
    if (!boksiLaSearch) return;

    // 2. Geuza herufi zote kuwa ndogo (Lower Case) ili kusafisha utafutaji
    const nenoLinalotafutwa = boksiLaSearch.value.toLowerCase().trim();

    // 3. Kamata vifungo vyote vya mikoa na wilaya vyenye class ya mkoa-card-btn
    const vifungoVyaMaeneo = document.querySelectorAll(".mkoa-item-btn");

    // 4. Pita kwenye kila kitufe na ukague kama herufi zinaendana
    vifungoVyaMaeneo.forEach(kifungo => {
        // Soma maandishi yaliyopo juu ya kitufe (mfano: Temeke, Kinondoni, Mombasa)
        const jinaLaEneo = kifungo.textContent || kifungo.innerText;
        const jinaSafi = jinaLaEneo.toLowerCase();

        // KAGUA: Kama jina la eneo lina yale maandishi ya kwenye boksi
        if (jinaSafi.includes(nenoLinalotafutwa)) {
            // Kama neno lipo, rudi kiooni kwa nguvu na ondoa mtindo wowote wa kujificha
            kifungo.style.setProperty("display", "inline-block", "important");
        } else {
            // Kama halipo, lifute kiooni kabisa sekunde hiyo hiyo
            kifungo.style.setProperty("display", "none", "important");
        }
    });
}

// MTEGO WA ZIADA (BACKUP): Hakikisha inafanya kazi hata kama onkeyup ya HTML ikizenga
document.addEventListener("DOMContentLoaded", () => {
    const boksiLaSearch = document.getElementById("mkoa-search-input");
    if (boksiLaSearch) {
        // Inasikiliza kila mguso, kila herufi inayoshuka, na hata mtu akipaste neno
        boksiLaSearch.addEventListener("input", tafutaMkoa);
    }
});

    </script>
